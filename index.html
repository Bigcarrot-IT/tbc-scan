<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan · Movement Report</title>
<!--
  Live barcode scanner for the Big Carrot Movement Report.
  Apps Script pages are not allowed to use the live camera, so this one page is hosted elsewhere
  (e.g. GitHub Pages). It holds NO store data: it only reads a barcode and hands the number back
  to the Movement Report app, then closes.
-->
<style>
  :root{--plum:#3e2a56;--lav:#c6bcd0}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1b1324;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{display:flex;flex-direction:column;height:100%}
  .top{background:var(--plum);display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}
  .top b{flex:1;font-size:16px}
  button{font:inherit;color:inherit;cursor:pointer}
  .btn{height:44px;min-width:44px;padding:0 14px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center}
  .view{position:relative;flex:1;overflow:hidden;background:#000}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .frame{position:absolute;left:10%;right:10%;top:36%;height:28%;border:3px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .line{position:absolute;left:14%;right:14%;top:50%;height:2px;background:#7fd4a3;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .bottom{padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));text-align:center;font-size:15px;color:#e9e2f2;min-height:64px}
  .found{color:#7fd4a3;font-weight:600}
  .err{color:#ffb4ab}
  .back{margin-top:10px;display:inline-flex;height:44px;align-items:center;padding:0 18px;border-radius:999px;background:var(--lav);color:var(--plum);font-weight:600;text-decoration:none;border:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button type="button" class="btn" id="cancel">Cancel</button>
    <b>Scan shelf tag</b>
    <button type="button" class="btn" id="torch" aria-label="Flashlight" hidden>
      <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1L4 9h4l-1 6 5-8H8l1-6z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="view">
    <video id="v" playsinline muted autoplay></video>
    <div class="frame" aria-hidden="true"></div><div class="line" aria-hidden="true"></div>
  </div>
  <div class="bottom" id="status" role="status" aria-live="polite">Starting camera…</div>
</div>
<canvas id="c" hidden></canvas>
<script>
(function () {
  'use strict';
  var ZXING_URL = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
  var params = new URLSearchParams(location.search);
  var ret = params.get('return') || '';
  // Only ever send people back to an Apps Script web app (never to any other site)
  var safeReturn = /^https:\/\/script\.google\.com\/(a\/macros\/[^\/?#]+\/|macros\/)s\/[\w-]+\/(exec|dev)(\?|$)/.test(ret) ? ret : '';

  var $ = function (id) { return document.getElementById(id); };
  var stream = null, timer = null, detector, zx = null, busy = false, torchOn = false, finished = false;

  function status(html, cls) { var s = $('status'); s.className = 'bottom' + (cls ? ' ' + cls : ''); s.innerHTML = html; }
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function loadScript(src) {
    return new Promise(function (res, rej) {
      var el = document.createElement('script'); el.src = src; el.onload = res;
      el.onerror = function () { rej(new Error('Could not load the barcode reader')); };
      document.head.appendChild(el);
    });
  }

  async function decode(canvas) {
    if (detector === undefined) {
      detector = null;
      if ('BarcodeDetector' in window) {
        try {
          var have = await BarcodeDetector.getSupportedFormats();
          var want = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'].filter(function (f) { return have.indexOf(f) >= 0; });
          if (want.length) detector = new BarcodeDetector({ formats: want });
        } catch (e) { detector = null; }
      }
      if (!detector) {
        if (!window.ZXing) await loadScript(ZXING_URL);
        var Z = window.ZXing, hints = new Map();
        hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A,
          Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.ITF]);
        hints.set(Z.DecodeHintType.TRY_HARDER, true);
        zx = new Z.MultiFormatReader(); zx.setHints(hints);
      }
    }
    if (!canvas) return null;
    if (detector) { var r = await detector.detect(canvas); return r.length ? r[0].rawValue : null; }
    try {
      var Z2 = window.ZXing;
      return zx.decode(new Z2.BinaryBitmap(new Z2.HybridBinarizer(new Z2.HTMLCanvasElementLuminanceSource(canvas)))).getText();
    } catch (e) { return null; }
  }

  async function startCamera() {
    var tries = [
      { audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } },
      { audio: false, video: { facingMode: 'environment' } },
      { audio: false, video: true }
    ], last = null;
    for (var i = 0; i < tries.length; i++) {
      try { return await navigator.mediaDevices.getUserMedia(tries[i]); }
      catch (e) { last = e; if (e && e.name === 'NotAllowedError') break; }
    }
    throw last;
  }

  function loop() {
    clearTimeout(timer);
    timer = setTimeout(async function () {
      if (finished || !stream) return;
      var v = $('v');
      if (v.videoWidth && !busy) {
        busy = true;
        try {
          var c = $('c'), w = v.videoWidth, h = v.videoHeight, bandH = Math.round(h * 0.5);
          c.width = w; c.height = bandH;
          c.getContext('2d', { willReadFrequently: true }).drawImage(v, 0, (h - bandH) / 2, w, bandH, 0, 0, w, bandH);
          var code = await decode(c);
          if (code && /^[0-9A-Za-z-]{1,40}$/.test(code)) { done(code); busy = false; return; }
        } catch (e) { /* keep trying */ }
        busy = false;
      }
      loop();
    }, 200);
  }

  function stop() {
    clearTimeout(timer);
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    stream = null;
  }

  function backWithCode(code) {
    if (!safeReturn) { status('Found <b>' + esc(code) + '</b>. Go back to the Movement Report and type it in.', 'found'); return; }
    var u = new URL(safeReturn); u.searchParams.set('scan', code);
    location.replace(u.toString());
  }

  function done(code) {
    finished = true; stop();
    if (navigator.vibrate) navigator.vibrate(80);
    status('Found <b>' + esc(code) + '</b>', 'found');
    var sent = false;
    try {
      if (window.opener && !window.opener.closed) { window.opener.postMessage({ type: 'mr-scan', code: code }, '*'); sent = true; }
    } catch (e) { sent = false; }
    if (!sent) { backWithCode(code); return; }
    setTimeout(function () { window.close(); }, 120);
    setTimeout(function () {                     // the browser kept this tab open: offer the way back
      if (!window.closed) {
        status('Found <b>' + esc(code) + '</b>. Switch back to the Movement Report tab.<br>' +
          (safeReturn ? '<button type="button" class="back" id="openHere">Open the app here</button>' : ''), 'found');
        var b = $('openHere'); if (b) b.onclick = function () { backWithCode(code); };
      }
    }, 700);
  }

  $('cancel').onclick = function () {
    stop();
    try { if (window.opener && !window.opener.closed) { window.close(); } } catch (e) { /* ignore */ }
    setTimeout(function () { if (safeReturn) location.replace(safeReturn); else history.back(); }, 200);
  };
  $('torch').onclick = async function () {
    var t = stream && stream.getVideoTracks()[0]; if (!t) return;
    torchOn = !torchOn;
    try { await t.applyConstraints({ advanced: [{ torch: torchOn }] }); } catch (e) { /* not supported */ }
  };

  (async function start() {
    decode(null).catch(function () {});           // warm up the reader
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      status('This browser cannot use the camera. Open this page in Chrome or Safari.', 'err'); return;
    }
    try {
      stream = await startCamera();
      var v = $('v'); v.srcObject = stream; await v.play();
      var track = stream.getVideoTracks()[0];
      var caps = track.getCapabilities ? track.getCapabilities() : {};
      $('torch').hidden = !caps.torch;
      if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) {
        try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) { /* optional */ }
      }
      status('Hold the barcode inside the box');
      loop();
    } catch (e) {
      var n = (e && e.name) || 'Error';
      status(n === 'NotAllowedError'
        ? 'Camera access was refused. Tap the icon left of the address › Permissions › Camera › Allow, then reload this page.'
        : 'The camera could not start [' + esc(n) + '].', 'err');
    }
  })();
})();
</script>
</body>
</html>
